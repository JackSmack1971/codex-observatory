[project]
name = "codex-observatory"
version = "0.1.0"
description = "A local, privacy-bounded Codex telemetry observatory"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb",
    "fastapi",
    "httpx",
    "openai",
    "opentelemetry-proto",
    "platformdirs",
    "protobuf",
    "pydantic",
    "tomlkit",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[project.scripts]
codex-observatory = "codex_observatory.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
